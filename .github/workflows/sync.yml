name: Sync eBay listings and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes, refresh from eBay
  workflow_dispatch:          # lets you run it on demand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore description cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: desc-cache-${{ github.run_id }}
          restore-keys: desc-cache-

      - name: Pull latest eBay listings
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_SELLER: thewearforce
          DESC_CACHE: .cache/descriptions.json
        run: python scripts/fetch_ebay.py

      - name: Prepare the published folder
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
